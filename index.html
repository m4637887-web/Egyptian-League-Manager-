<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>EGYPTIAN LEAGUE MANAGER 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1a15;--pit:#12261e;--pit2:#1a3629;--turf:#1f7a4d;--brass:#d9a441;--chalk:#f2efe6;--red:#d64545;--mute:#8fa89b;--blue:#4a90d9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--ink);color:var(--chalk);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--pit2);padding:8px 12px;border-radius:8px;transition:transform .12s,background .15s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.pri{background:var(--brass);color:var(--ink);font-weight:800}
button.dan{background:var(--red)}
button.sm{padding:4px 8px;font-size:12px}
input,select{background:var(--pit);border:1px solid #2c4a3b;border-radius:8px;padding:8px;min-width:0}
#app{display:grid;min-height:100%;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--pit);border-bottom:2px solid var(--brass);position:sticky;top:0;z-index:5}
header h1{font-size:15px;font-weight:800;flex:1;letter-spacing:.5px}
header .chip{background:var(--pit2);padding:4px 10px;border-radius:20px;font-size:13px}
nav{display:flex;overflow-x:auto;background:var(--pit);border-top:1px solid #2c4a3b;padding-bottom:env(safe-area-inset-bottom,0px);position:sticky;bottom:0;z-index:5}
nav button{flex:1;min-width:74px;background:none;border-radius:0;padding:10px 4px;font-size:12px;color:var(--mute)}
nav button.on{color:var(--brass);box-shadow:inset 0 -3px var(--brass);font-weight:800}
main{padding:14px;max-width:980px;width:100%;margin:auto;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:900px){#app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}header{grid-column:1/3}nav{grid-row:2;flex-direction:column;position:sticky;top:50px;height:calc(100vh - 50px);border-top:0;border-left:1px solid #2c4a3b}nav button{text-align:right;padding:14px;font-size:14px;flex:none}nav button.on{box-shadow:inset -3px 0 var(--brass)}main{grid-row:2;grid-column:2}}
.card{background:var(--pit);border:1px solid #243f32;border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:8px;color:var(--brass)}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1d3529}
.row:last-child{border:0}
.row .g{flex:1;min-width:0}
.row small,.mut{color:var(--mute);font-size:12px}
.badge{display:inline-grid;place-items:center;min-width:30px;height:26px;border-radius:6px;font-weight:800;font-size:13px;color:var(--ink)}
.b1{background:#3ecf7a}.b2{background:#a8d94a}.b3{background:#e8c53e}.b4{background:#e8873e}
.pos{font-size:11px;padding:2px 6px;border-radius:5px;background:#2c4a3b}
.bar{height:5px;background:#243f32;border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--brass)}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.club{padding:14px 8px;text-align:center;background:var(--pit);border:1px solid #243f32;border-radius:12px}
.crest{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--chalk);border:3px solid var(--brass)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 3px;text-align:center}th{color:var(--mute);font-weight:500}td:nth-child(2){text-align:right}tr.me{background:#243f32;color:var(--brass);font-weight:800}tbody tr{border-bottom:1px solid #1d3529}
.pitch{position:relative;aspect-ratio:3/4;max-width:420px;margin:auto;border:2px solid var(--chalk);border-radius:10px;background:repeating-linear-gradient(var(--turf) 0 8.3%,#1b6e45 8.3% 16.6%);overflow:hidden}
.pitch:before{content:"";position:absolute;inset:50% 0 auto;border-top:2px solid #ffffff80}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;border:2px solid #ffffff80;border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;transform:translate(-50%,-50%);width:70px;text-align:center;font-size:11px;z-index:2;background:none;padding:0;color:#fff;text-shadow:0 1px 2px #000}
.dot{width:36px;height:36px;border-radius:50%;margin:0 auto 2px;display:grid;place-items:center;font-weight:800;background:var(--chalk);color:var(--ink);border:2px solid var(--ink)}
.slot.sel .dot{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button.on{background:var(--brass);color:var(--ink)}
.feed{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #1d3529}.av{width:38px;height:38px;border-radius:50%;background:var(--pit2);display:grid;place-items:center;flex:none;font-size:18px}
#mt{position:fixed;inset:0;background:var(--ink);z-index:20;overflow-y:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.score{display:flex;justify-content:center;align-items:center;gap:14px;font-size:30px;font-weight:800;margin:6px 0}
.score span.t{font-size:14px;flex:1;text-align:center;font-weight:700}
.ev{padding:5px 0;border-bottom:1px solid #1d3529;font-size:14px}.ev b{color:var(--brass);margin-left:6px}
.stat{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;text-align:center;font-size:13px;margin:5px 0}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--brass);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;max-width:90%;text-align:center}
.warn{background:#3a2d12;border:1px solid var(--brass);padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:12px}
h3.hero{font-size:26px;font-weight:800;margin-bottom:4px}
</style>
</head>

function slots(f){const p=f.split("-").map(Number),o=[{pos:"GK",x:50,y:92}];p.forEach((n,i)=>{const pos=i==0?"DF":i==p.length-1?"FW":"MF";const y=74-(58*i/(p.length-1));for(let j=0;j<n;j++)o.push({pos,x:100*(j+1)/(n+1),y})});return o}

function mkPlayer(pos,i,base,no){const r=clamp(Math.round(base+R(-9,6)),40,92),p={id:S.rid++,n:POS[pos]+" "+i,a:RI(18,35),nat:"—",pos,no,r,inj:0,ban:0,fat:0,g:0,as:0,ap:0,c:RI(1,4),ex:0};p.w=wageOf(p);return p}
function mkTeam(name,str,i){const pls=[];let no=1;[["GK",3],["DF",8],["MF",7],["FW",5]].forEach(([pos,n])=>{for(let k=1;k<=n;k++)pls.push(mkPlayer(pos,k,str-8+(pos=="GK"?-2:0),no++))});return{i,name,str,col:COL[i],players:pls,f:"4-3-3",st:pick(["balanced","attack","defend","poss","counter"]),lu:[],P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0,form:[]}}

function autoLU(t){const used=new Set(),sl=slotsOf(t);t.lu=sl.map(s=>{const p=bestFor(t,s.pos,used);if(p){used.add(p.id);return p.id}return 0})}
function fixLU(t){const sl=slotsOf(t);if(t.lu.length!==sl.length){autoLU(t);return}const used=new Set(t.lu.filter(id=>{const p=pl(t,id);return p&&avail(p)}));t.lu=t.lu.map((id,i)=>{const p=pl(t,id);if(p&&avail(p))return id;const n=bestFor(t,sl[i].pos,used);if(n){used.add(n.id);return n.id}return 0})}
function fixtures(){const n=18;let a=[...Array(n).keys()];const h1=[];for(let r=0;r<n-1;r++){const w=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];w.push((r+i)%2?[x,y]:[y,x])}h1.push(w);a=[a[0],a[n-1],...a.slice(1,n-1)]}return h1.concat(h1.map(w=>w.map(([x,y])=>[y,x])))}

function newGame(me){S={rid:1,me,season:2027,week:0,T:[],fx:fixtures(),res:{},feed:[],offers:[],listed:{},led:[],log:[],budget:0,tab:"home"};S.T=CL.map((c,i)=>mkTeam(c[0],c[1],i));applyRoster(S.T);S.T.forEach(autoLU);initCup();S.mgr={yrs:3,conf:60};S.budget=Math.round(60+(S.T[me].str-60)*6);post("مدير النادي","أنباء",`${S.T[me].name} يعلن تعيين مدرب جديد قبل انطلاق موسم 2026/27. الجماهير تنتظر البداية.`);save()}

const wpick=(a,f)=>{const w=a.map(f),s=w.reduce((x,y)=>x+y,0);if(!s)return null;let r=Math.random()*s;for(let i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i]}return a[a.length-1]};
function startMatch(h,a){[h,a].forEach(fixLU);const M={t:[h,a],min:0,sc:[0,0],ev:[],sh:[0,0],sot:[0,0],pos:[0,0],out:[new Set,new Set],yel:{},pr:{},played:new Set,goals:[],newInj:[],newBan:[],cards:[0,0],uIdx:h.i===S.me?0:a.i===S.me?1:-1,auto:true,nsub:[0,0],wset:[new Set,new Set],offed:new Set,sid:0,forced:null};[h,a].forEach(t=>t.lu.forEach(id=>id&&M.played.add(id)));return M}
function power(M,s){const t=M.t[s],sl=slotsOf(t),g={GK:[],DF:[],MF:[],FW:[]};let n=0;t.lu.forEach((id,i)=>{const p=pl(t,id);if(!p||M.out[s].has(id))return;n++;g[sl[i].pos].push(p.r*(1-p.fat/250)*((sl[i].pos===p.pos||(p.alt||[]).includes(sl[i].pos))?1:.8))});
const a=k=>g[k].length?g[k].reduce((x,y)=>x+y)/g[k].length:45;let at=.5*a("FW")+.35*a("MF")+.15*a("DF"),df=.25*a("GK")+.5*a("DF")+.25*a("MF"),md=a("MF");const st=t.st;
if(st=="attack"){at*=1.08;df*=.94}else if(st=="defend"){at*=.92;df*=1.08}else if(st=="poss"){md*=1.1;at*=1.02;df*=1.02}else if(st=="counter"){at*=1.03;df*=1.03}
const k=Math.pow(Math.max(n,1)/11,1.5);return{att:at*k,def:df*k,mid:md*k}}
function step(M){M.min++;const m=M.min,P=[power(M,0),power(M,1)];
for(let s=0;s<2;s++){const t=M.t[s],o=M.t[1-s];M.pos[s]+=P[s].mid/(P[0].mid+P[1].mid);
const xi=t.lu.map(id=>pl(t,id)).filter(p=>p&&!M.out[s].has(p.id));
const ratio=P[s].att/P[1-s].def;
if(Math.random()<.135*Math.pow(ratio,2.2)*(s?1:1.08)){M.sh[s]++;if(Math.random()<.42){M.sot[s]++;if(Math.random()<.22){
const sc=wpick(xi,p=>({FW:6,MF:2.5,DF:.7,GK:0})[p.pos]);if(sc){let as=null;if(Math.random()<.65)as=wpick(xi.filter(p=>p!==sc),p=>({FW:3,MF:4,DF:1.2,GK:0})[p.pos]);M.sc[s]++;M.goals.push({s,sid:sc.id,aid:as?as.id:0});M.ev.push({m,k:"g",x:`⚽ هدف ل${t.name}! ${sc.n}`+(as?` (صناعة ${as.n})`:"")+` — ${M.sc[0]}-${M.sc[1]}`})}}
else if(Math.random()<.3)M.ev.push({m,k:"s",x:`🧤 تصدٍّ لتسديدة من ${t.name}`})}}
if(xi.length&&Math.random()<.011){const p=pick(xi);if(M.yel[p.id]){M.out[s].add(p.id);M.ev.push({m,k:"r",x:`🟥 طرد ${p.n} (${t.name}) بعد إنذار ثانٍ`});M.newBan.push(p)}else{M.yel[p.id]=1;M.ev.push({m,k:"y",x:`🟨 إنذار ${p.n} (${t.name})`})}}
if(xi.length&&Math.random()<.0006){const p=pick(xi);M.out[s].add(p.id);M.newBan.push(p);M.ev.push({m,k:"r",x:`🟥 طرد مباشر ل${p.n} (${t.name})`})}
if(xi.length&&Math.random()<.0007){const p=pick(xi);M.newInj.push([p,RI(1,6)]);M.out[s].add(p.id);M.ev.push({m,k:"i",x:`🩹 إصابة ${p.n} (${t.name})`});const idx=t.lu.indexOf(p.id);if(M.uIdx===s&&!M.auto)M.forced={s,idx,pid:p.id};else injSub(M,s,idx,null);}}

function finish(M){const[h,a]=M.t,uid=S.me;

if(mine>=0){const s=mine,gf=M.sc[s],ga=M.sc[1-s],o=M.t[1-s],t=M.t[s];const u=Math.pow(t.str/100,3)*2,pz=+(gf>ga?3*u:gf==ga?u:0).toFixed(1);if(pz>0){S.budget=+(S.budget+pz).toFixed(1);S.led.unshift({w:S.week+1,t:gf>ga?"مكافأة الفوز (راعٍ/اتحاد)":"مكافأة التعادل",a:pz})}S.mgr.conf=clamp(S.mgr.conf+(gf>ga?2:gf==ga?0:-2.5),0,100);

}

const o=pick(S.T.filter(t=>t.i!==S.me)),q=pick(o.players);post("حساب الانتقالات","@transfers",`شائعات: ${pick(S.T.filter(t=>t.i!==o.i)).name} يراقب ${q.n} (${o.name}) تحسباً للانتقال.`)}

function injSub(M,s,idx,b){const t=M.t[s],old=pl(t,t.lu[idx]),pos=slotsOf(t)[idx].pos;if(!old)return;if(!b){const inLU=new Set(t.lu),fit=q=>q.pos===pos||(q.alt||[]).includes(pos);b=t.players.filter(q=>avail(q)&&!inLU.has(q.id)&&!M.newInj.some(z=>z[0]===q)&&!M.out[s].has(q.id)&&!M.offed.has(q.id)).sort((x,y)=>(fit(y)-fit(x))||y.r-x.r)[0]}
if(b&&M.nsub[s]<5){t.lu[idx]=b.id;M.nsub[s]++;M.played.add(b.id);M.offed.add(old.id);M.ev.push({m:M.min,k:"c",x:`🔄 ${t.name}: يدخل ${b.n} بدلاً من ${old.n}`})}}
function benchOf(M){const t=M.t[M.uIdx];return t.players.filter(q=>avail(q)&&!t.lu.includes(q.id)&&!M.offed.has(q.id)&&!M.newInj.some(z=>z[0]===q)).sort((a,b)=>b.r-a.r)}

const CUPN=["الملحق","دور الـ16","ربع النهائي","نصف النهائي","النهائي"],CUPW=[4,10,16,22,28];
function initCup(){const o=S.T.map(t=>t.i).sort((a,b)=>S.T[b].str-S.T[a].str);S.cup={seeds:o,alive:o.slice(),r:0,fx:null,res:{},over:false,champ:null}}
function cupPending(){const c=S.cup;return c&&!c.over&&S.week>=CUPW[c.r]}
function cupPairs(){const c=S.cup;if(c.fx)return c.fx;let p=[];if(c.r==0){const a=c.seeds.slice(14);p=[[a[0],a[3]],[a[1],a[2]]]}else{const al=c.alive.slice().sort(()=>Math.random()-.5);for(let i=0;i<al.length;i+=2)p.push([al[i],al[i+1]])}c.fx=p;return p}
function playCup(uM){const c=S.cup,fx=cupPairs(),out=[],win=[];fx.forEach(([h,a])=>{let M;if(uM&&(h==S.me||a==S.me))M=uM;else{M=startMatch(S.T[h],S.T[a]);for(let i=0;i<90;i++)step(M)}M.cup=true;finish(M);let w=M.sc[0]>M.sc[1]?h:M.sc[1]>M.sc[0]?a:null,pen="";if(w===null){w=Math.random()<S.T[h].str/(S.T[h].str+S.T[a].str)?h:a;const ps=RI(3,5);pen=`ركلات ترجيح: ${S.T[w].name} يتأهل (${ps}-${RI(2,ps-1)})`}M.pen=pen;out.push({h,a,sh:M.sc[0],sa:M.sc[1],pen});win.push(w)});
c.res[c.r]=out;c.alive=c.r==0?c.seeds.filter(i=>!fx.some(([h,a])=>h==i||a==i)||win.includes(i)):win;
if(fx.some(([h,a])=>h==S.me||a==S.me)&&!c.alive.includes(S.me))post("محلل كروي","@analyst",`${me().name} يودّع كأس مصر من ${CUPN[c.r]}.`);
c.r++;c.fx=null;if(c.alive.length==1){c.over=true;c.champ=c.alive[0];post("صحفي رياضي","@sportsdesk",`${S.T[c.champ].name} يتوّج بكأس مصر!`);if(c.champ==S.me){S.budget=+(S.budget+15).toFixed(1);S.led.unshift({w:S.week,t:"جائزة كأس مصر",a:15})}}save()}
function cupMine(){return cupPending()&&cupPairs().some(([h,a])=>h==S.me||a==S.me)}
function cupCheck(){const c=S.cup;if(!c)return;let g=0;while(cupPending()&&!cupMine()&&g++<6)playCup(null)}
function cupView(){const c=S.cup,row=x=>`<div class="row">${crest(x.h,20)}<span class="g">${S.T[x.h].name}</span><b>${x.sh} - ${x.sa}</b><span class="g" style="text-align:left">${S.T[x.a].name}</span>${crest(x.a,20)}</div>${x.pen?`<small class="mut">${x.pen}</small>`:""}`;
let h=`<div class="card"><h2>كأس مصر</h2><p>${c.over?"البطل: "+S.T[c.champ].name:"الدور القادم: "+CUPN[c.r]+" (بعد الأسبوع "+CUPW[c.r]+")"}</p>${c.over?"":`<p class="mut">${c.alive.length} فريق متبقٍ، ${c.alive.includes(S.me)?"وفريقك ما زال في البطولة":"وفريقك خرج"}</p>`}</div>`;
if(cupPending())h+=`<div class="card"><h2>${CUPN[c.r]} — قادمة</h2>${cupPairs().map(([a,b])=>`<div class="row">${crest(a,20)}<span class="g">${S.T[a].name}</span><span>×</span><span class="g" style="text-align:left">${S.T[b].name}</span>${crest(b,20)}</div>`).join("")}</div>`;
Object.keys(c.res).reverse().forEach(r=>{h+=`<div class="card"><h2>${CUPN[r]}</h2>${c.res[r].map(row).join("")}</div>`});return h}

function makeReview(){const m=me(),exp=S.T.slice().sort((a,b)=>b.str-a.str).indexOf(m)+1,rk=table().indexOf(m)+1,perf=exp-rk,cupWin=!!S.cup&&S.cup.champ===S.me,oth=S.T.filter(t=>t.i!==S.me),rnd=a=>a.sort(()=>Math.random()-.5).slice(0,3).map(t=>t.i);
S.mgr.conf=clamp(S.mgr.conf+perf*3+(cupWin?8:0),0,100);S.mgr.yrs--;
const expired=S.mgr.yrs<=0,sacked=S.mgr.conf<25||(expired&&S.mgr.conf<40);let offers=[];
if(perf>=2||rk<=3)offers=rnd(oth.filter(t=>t.str>m.str));
if(sacked)offers=rnd(oth.filter(t=>t.str<=m.str+1));
if(!offers.length&&(sacked||expired))offers=rnd(oth.slice());
S.review={rk,exp,perf,cupWin,sacked,expired,offers,done:!sacked&&!expired};
post("صحفي رياضي","@sportsdesk",sacked?`${m.name} يستغني عن مدربه بعد موسم مخيب.`:perf>=2?`عروض تدريب تنتظر مدرب ${m.name} بعد موسم رائع.`:`${m.name} ينهي الموسم في المركز ${rk}.`);save();return S.review}

return`${nx}<div class="grid2"><div class="card"><h2>الترتيب: ${rk}</h2><p>${m.Pts} نقطة · ${m.W}ف ${m.D}ت ${m.L}خ</p><p class="mut">آخر 5: ${fmL(m)}</p><p class="mut">ثقة الإدارة ${Math.round(S.mgr.conf)}% · عقدك ${S.mgr.yrs} سنوات</p><p class="mut">نافذة الانتقالات: ${winOpen()?"مفتوحة ("+winOpen()+")":"مغلقة"}</p></div><div class="card"><h2>الإصابات والإيقافات</h2>${m.players.filter(p=>p.inj||p.ban).map(p=>pRow(p)).join("")||`<span class="mut">لا يوجد. الفريق جاهز.</span>`}</div></div><div class="card"><h2>عروض الشراء</h2>${off.replace(/\s/g,"")?off:`<span class="mut">لا توجد عروض الآن. اعرض لاعباً للبيع من صفحة الفريق.</span>`}</div>`},
squad(){const m=me();return`<div class="warn">${m.real?"قائمة مستوردة: الأسماء من القوائم المرسلة، والتقييمات تقديرية، والعمر 25 افتراضياً.":"أسماء اللاعبين وتقييماتهم هنا هيكل تجريبي، وليست بيانات حقيقية. عدّل الأسماء بزر ✎ أو استورد قوائمك من الإعدادات."}</div>${["GK","DF","MF","FW"].map(pos=>`<div class="card"><h2>${POS[pos]}ون (${m.players.filter(p=>p.pos==pos).length})</h2>${m.players.filter(p=>p.pos==pos).sort((a,b)=>b.r-a.r).map(p=>pRow(p,`<div style="display:flex;gap:4px;flex-wrap:wrap;max-width:150px;justify-content:flex-end"><button class="sm" onclick="editP(${p.id})">✎</button><button class="sm" onclick="exTog(${p.id})">${p.ex?"إعادة":"استبعاد"}</button><button class="sm" onclick="listTog(${p.id})">${S.listed[p.id]?"إلغاء البيع":"للبيع"}</button><button class="sm" onclick="renew(${p.id})">تجديد</button><button class="sm" onclick="loanOut(${p.id})">إعارة</button></div>`)).join("")}</div>`).join("")}`},
tac(){const m=me(),sl=slotsOf(m),inLU=new Set(m.lu);
const pitch=`<div class="pitch" onclick="pitchTap(event)">${sl.map((s,i)=>{const p=pl(m,m.lu[i]);return`<button class="slot ${selSlot===i?"sel":""}" style="left:${s.x}%;top:${s.y}%" onclick="event.stopPropagation();slotTap(${i})"><div class="dot">${p?p.r:"?"}</div>${p?p.n:"فارغ"}</button>`}).join("")}</div>`;
const bench=m.players.filter(p=>!inLU.has(p.id)).sort((a,b)=>b.r-a.r);
return`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><select onchange="setF(this.value)">${FORMS.map(f=>`<option ${m.f==f?"selected":""}>${f}</option>`).join("")}</select><select onchange="setSt(this.value)">${Object.entries(STY).map(([k,v])=>`<option value="${k}" ${m.st==k?"selected":""}>${v}</option>`).join("")}</select><button onclick="autoPick()">اختيار تلقائي</button></div><p class="mut" style="margin-top:6px">اضغط لاعباً في الملعب ثم اضغط مكاناً فارغاً لتحريكه، أو اضغط لاعباً آخر لتبادل المركزين، أو اضغط لاعباً من الاحتياط لإشراكه. مركز اللاعب يتحدد بمكانه في الملعب.</p></div>${pitch}<div class="card" style="margin-top:12px"><h2>الاحتياط</h2>${bench.map(p=>pRow(p,`<button class="sm pri" onclick="place(${p.id})">إشراك</button>`)).join("")}</div>`},
mkt(){const m=me(),w=winOpen();const rs=S.T.filter(t=>t.i!==S.me).flatMap(t=>t.players.filter(p=>p.lf==null).map(p=>({p,t}))).filter(({p})=>(!mq.n||p.n.includes(mq.n))&&(!mq.p||p.pos==mq.p)&&p.a<=mq.a&&p.r>=mq.r).sort((a,b)=>b.p.r-a.p.r).slice(0,40);
const loans=S.T.flatMap(t=>t.players.filter(p=>p.lf!=null&&(t.i===S.me||p.lf===S.me)).map(p=>({p,t})));
return`<div class="warn">${w?"نافذة الانتقالات "+w+" مفتوحة.":"النافذة مغلقة. الصيفية في أول 4 أسابيع، والشتوية من الأسبوع 17 إلى 20."} الميزانية: ${fm(S.budget)}</div><div class="card"><h2>البحث</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input placeholder="الاسم" value="${mq.n}" oninput="mq.n=this.value;mres()"><select onchange="mq.p=this.value;mres()"><option value="">كل المراكز</option>${Object.entries(POS).map(([k,v])=>`<option value="${k}" ${mq.p==k?"selected":""}>${v}</option>`).join("")}</select><label class="mut">أقصى عمر <input type="number" style="width:60px" value="${mq.a}" oninput="mq.a=+this.value||99;mres()"></label><label class="mut">أدنى تقييم <input type="number" style="width:60px" value="${mq.r}" oninput="mq.r=+this.value||0;mres()"></label></div></div><div class="card" id="mres">${mresH(rs)}</div><div class="card"><h2>الإعارات</h2>${loans.map(({p,t})=>pRow(p,`<button class="sm" onclick="renewLoan(${p.id})">${p.lr?"مجددة":"تجديد الإعارة"}</button>`)+`<small class="mut">${t.i===S.me?"معار إليك من "+S.T[p.lf].name:"معار من فريقك إلى "+t.name}</small>`).join("")||`<span class="mut">لا توجد إعارات.</span>`}</div>`},
lg(){const t=table();const fx=S.fx[Math.min(S.week,33)],last=S.res[S.week-1];const all=S.T.flatMap(t=>t.players.map(p=>({p,t})));const sc=all.filter(x=>x.p.g).sort((a,b)=>b.p.g-a.p.g).slice(0,8),as=all.filter(x=>x.p.as).sort((a,b)=>b.p.as-a.p.as).slice(0,8);
return`<div class="tabs">${[["table","الترتيب"],["fx","المباريات"],["st","الهدافون"],["cup","كأس مصر"]].map(([k,v])=>`<button class="${sub==k?"on":""}" onclick="sub='${k}';render()">${v}</button>`).join("")}</div>`+(sub=="table"?`<div class="card" style="overflow-x:auto"><table><thead><tr><th>#</th><th>النادي</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>له</th><th>عليه</th><th>نقاط</th></tr></thead><tbody>${t.map((x,i)=>`<tr class="${x.i==S.me?"me":""}"><td>${i+1}</td><td style="white-space:nowrap">${crest(x.i,18)} ${x.name}</td><td>${x.P}</td><td>${x.W}</td><td>${x.D}</td><td>${x.L}</td><td>${x.GF}</td><td>${x.GA}</td><td>${x.Pts}</td></tr>`).join("")}</tbody></table></div>`:sub=="fx"?`<div class="card"><h2>نتائج الأسبوع ${S.week}</h2>${last?last.map(r=>`<div class="row">${crest(r.h,20)}<span class="g">${S.T[r.h].name}</span><b>${r.sh} - ${r.sa}</b><span class="g" style="text-align:left">${S.T[r.a].name}</span>${crest(r.a,20)}</div>`).join(""):`<span class="mut">لم تُلعب مباريات بعد.</span>`}</div>${S.week<34?`<div class="card"><h2>الأسبوع ${S.week+1}</h2>${fx.map(([h,a])=>`<div class="row">${crest(h,20)}<span class="g">${S.T[h].name}</span><span>×</span><span class="g" style="text-align:left">${S.T[a].name}</span>${crest(a,20)}</div>`).join("")}</div>`:""}`:sub=="cup"?cupView():`<div class="grid2"><div class="card"><h2>الهدافون</h2>${sc.map(x=>`<div class="row"><span class="g">${x.p.n}<small> ${x.t.name}</small></span><b>${x.p.g}</b></div>`).join("")||`<span class="mut">لا أهداف بعد.</span>`}</div><div class="card"><h2>صناع الأهداف</h2>${as.map(x=>`<div class="row"><span class="g">${x.p.n}<small> ${x.t.name}</small></span><b>${x.p.as}</b></div>`).join("")||`<span class="mut">لا تمريرات حاسمة بعد.</span>`}</div></div>`)},
fin(){const m=me(),wg=m.players.reduce((s,p)=>s+(p.lf!=null&&p.lf!==S.me?0:p.w),0);return`<div class="grid2"><div class="card"><h2>الميزانية</h2><h3 class="hero">${fm(S.budget)}</h3>${S.budget<0?`<p style="color:var(--red)">الميزانية بالسالب. بِع لاعباً لتفادي المشاكل.</p>`:""}</div><div class="card"><h2>الرواتب</h2><p>فاتورة الأسبوع: ${fm(wg)}</p><p class="mut">رعاة: +${fm(Math.pow(m.str/100,3)*9)} أسبوعياً</p></div></div><div class="card"><h2>سجل الإيرادات والمصروفات</h2>${S.led.map(l=>`<div class="row"><small>أ${l.w}</small><span class="g">${l.t}</span><b style="color:${l.a<0?"var(--red)":"#3ecf7a"}">${l.a>0?"+":""}${fm(l.a)}</b></div>`).join("")||`<span class="mut">لا حركات بعد.</span>`}</div>`},
soc(){return`<div class="card"><h2>السوشيال ميديا</h2><p class="mut">منشورات تُولّد تلقائياً داخل اللعبة بحسب نتائجك وقراراتك. ليست أخباراً حقيقية.</p>${S.feed.map(f=>`<div class="feed"><div class="av">${f.a=="صحفي رياضي"?"📰":f.a.includes("مشجع")?"📣":f.a=="محلل كروي"?"📊":"🔁"}</div><div><b>${f.a}</b> <small class="mut">${f.h} · أسبوع ${f.w+1}</small><p>${f.t}</p><small class="mut">❤ ${f.l}</small></div></div>`).join("")}</div>`},
set(){return`<div class="card"><h2>استيراد قوائم اللاعبين الحقيقية</h2><p class="mut">الصق JSON بالشكل: {"clubs":[{"name":"الأهلي","players":[{"n":"الاسم","a":28,"nat":"مصر","pos":"FW","no":9,"r":80}]}]} ثم ابدأ مسيرة جديدة لتطبيقه. المراكز: GK, DF, MF, FW.</p><textarea id="ros" style="width:100%;height:110px;background:var(--pit2);color:var(--chalk);border:1px solid #2c4a3b;border-radius:8px;padding:8px;margin:8px 0" dir="ltr"></textarea><button class="pri" onclick="impRoster()">حفظ القوائم</button> <button onclick="localStorage.removeItem(RKEY);toast('تم المسح')">مسح القوائم</button></div><div class="card"><h2>شعارات الأندية</h2><p class="mut">الشعارات الحالية تصميمات أصلية بألوان النادي وليست الشعارات الرسمية. ارفع صورة الشعار الرسمي من عندك لأي نادٍ لتحل محلها.</p><select id="lgsel" style="margin:8px 0">${CL.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join("")}</select> <input type="file" accept="image/*" onchange="upLogo(this)"> <button onclick="rmLogos()">إعادة الشعارات الأصلية</button></div><div class="card"><h2>المسيرة</h2><p class="mut">الحفظ تلقائي بعد كل أسبوع.</p><br><button onclick="save();toast('تم الحفظ')">حفظ الآن</button> <button class="dan" onclick="if(confirm('بدء مسيرة جديدة؟ سيُحذف الحفظ الحالي.')){S=null;try{localStorage.removeItem(KEY)}catch(e){}render()}">مسيرة جديدة</button></div>`}};

/* ---------- actions ---------- */
function mresH(rs){const w=winOpen();return rs.length?rs.map(({p,t})=>pRow(p,`<div style="display:flex;flex-direction:column;gap:4px"><button class="sm pri" onclick="buy(${p.id},${t.i})">عرض شراء</button><button class="sm" onclick="loanIn(${p.id},${t.i})">استعارة</button></div>`)+`<small class="mut">${crest(t.i,16)} ${t.name}</small>`).join(""):`<span class="mut">لا نتائج. غيّر شروط البحث.</span>`}
function mres(){const rs=S.T.filter(t=>t.i!==S.me).flatMap(t=>t.players.filter(p=>p.lf==null).map(p=>({p,t}))).filter(({p})=>(!mq.n||p.n.includes(mq.n))&&(!mq.p||p.pos==mq.p)&&p.a<=mq.a&&p.r>=mq.r).sort((a,b)=>b.p.r-a.p.r).slice(0,40);$("#mres").innerHTML=mresH(rs)}
const find=id=>{for(const t of S.T){const p=pl(t,id);if(p)return{p,t}}};
function needWin(){if(!winOpen()){toast("نافذة الانتقالات مغلقة الآن");return false}return true}
function buy(id,ti){if(!needWin())return;const{p,t}=find(id);if(me().players.length>=32)return toast("القائمة ممتلئة (32 لاعباً كحد أقصى)");if(t.players.length<=MINSQ)return toast(`${t.name} يرفض بيع لاعبيه لقلة العدد`);const v=val(p);let a=v,fin=null;
for(let rd=0;rd<5;rd++){const x=prompt(`${p.n} (${t.name}) — قيمته ${v} م. اكتب عرضك بالمليون:`,a);if(x===null)return;a=+x;if(!(a>0))return;if(a>S.budget)return toast("عرضك أكبر من ميزانيتك");const k=a/v;
if(k>=1.15||(k>=.95&&Math.random()<.5)){fin=a;break}
if(k>=.75){const c=+(v*(1.1+rd*.03)).toFixed(1);if(c>S.budget)return toast("طلب النادي أعلى من ميزانيتك");if(confirm(`${t.name} يرفض ${a} م ويطلب ${c} م. هل تقبل؟ (إلغاء = قدّم عرضاً أعلى)`)){fin=c;break}a=c;continue}
return toast(`${t.name} رفض العرض نهائياً`)}
if(fin==null)return toast("انتهت المفاوضات بدون اتفاق");
const y=clamp(+prompt("مدة العقد بالسنوات (1-5):",3)||3,1,5);t.players.splice(t.players.indexOf(p),1);p.c=y;p.fat=0;me().players.push(p);S.budget=+(S.budget-fin).toFixed(1);S.led.unshift({w:S.week+1,t:`شراء ${p.n}`,a:-fin});post("حساب الانتقالات","@transfers",`رسمياً: ${me().name} يضم ${p.n} من ${t.name} مقابل ${fm(fin)} بعقد ${y} سنوات.`);post("مشجع","@fan"+RI(10,99),`صفقة ${p.n} ممتازة، الإدارة شغالة! 👏`);fixLU(me());save();toast("تمت الصفقة");render()}
function loanIn(id,ti){if(!needWin())return;const{p,t}=find(id),fee=+(val(p)*.12).toFixed(1);if(fee>S.budget)return toast("الميزانية لا تكفي");if(t.players.length<=18)return toast("النادي يرفض لقلة العدد");if(!confirm(`استعارة ${p.n} مقابل ${fee} م حتى نهاية الموسم؟`))return;t.players.splice(t.players.indexOf(p),1);p.lf=t.i;p.lr=0;me().players.push(p);S.budget=+(S.budget-fee).toFixed(1);S.led.unshift({w:S.week+1,t:`استعارة ${p.n}`,a:-fee});post("حساب الانتقالات","@transfers",`${me().name} يستعير ${p.n} من ${t.name}.`);save();render()}
function loanOut(id){if(!needWin())return;const m=me(),p=pl(m,id);if(p.lf!=null)return toast("اللاعب معار بالفعل");if(m.players.length<=18)return toast("لا يمكن النزول عن 18 لاعباً");const t=pick(S.T.filter(t=>t.i!==S.me)),fee=+(val(p)*.08).toFixed(1);if(!confirm(`إعارة ${p.n} إلى ${t.name} مقابل ${fee} م؟`))return;m.players.splice(m.players.indexOf(p),1);p.lf=S.me;p.lr=0;t.players.push(p);S.budget=+(S.budget+fee).toFixed(1);S.led.unshift({w:S.week+1,t:`إعارة ${p.n}`,a:fee});fixLU(m);save();render()}
function renewLoan(id){const{p}=find(id);if(p.lr)return;const inn=p.lf==S.me?false:true,fee=inn?+(val(p)*.05).toFixed(1):0;if(fee>S.budget)return toast("الميزانية لا تكفي");p.lr=1;S.budget=+(S.budget-fee).toFixed(1);if(fee)S.led.unshift({w:S.week+1,t:`تجديد إعارة ${p.n}`,a:-fee});toast("تم تجديد الإعارة لموسم إضافي");save();render()}
function accOffer(i){const o=S.offers[i],m=me(),p=pl(m,o.pid);if(!p){S.offers.splice(i,1);return render()}if(m.players.length<=18)return toast("لا يمكن البيع: القائمة 18 لاعباً فقط");if(!needWin())return;m.players.splice(m.players.indexOf(p),1);p.c=3;S.T[o.club].players.push(p);S.budget=+(S.budget+o.amt).toFixed(1);S.led.unshift({w:S.week+1,t:`بيع ${p.n}`,a:o.amt});delete S.listed[p.id];S.offers=S.offers.filter(x=>x.pid!==o.pid);post("حساب الانتقالات","@transfers",`${S.T[o.club].name} يتعاقد مع ${p.n} من ${m.name} مقابل ${fm(o.amt)}.`);if(p.r>=70)post("مشجع غاضب","@fan"+RI(10,99),`بيع ${p.n}؟! إدارة النادي لا تفهم 😤`);fixLU(m);save();render()}
function rejOffer(i){S.offers.splice(i,1);render()}
function listTog(id){if(S.listed[id])delete S.listed[id];else S.listed[id]=1;toast(S.listed[id]?"اللاعب معروض للبيع، انتظر العروض":"تم سحره من القائمة".replace("سحره","سحبه"));save();render()}
function exTog(id){const p=pl(me(),id);p.ex=p.ex?0:1;fixLU(me());save();render()}
function rename(id){const p=pl(me(),id),n=prompt("اسم اللاعب:",p.n);if(n&&n.trim()){p.n=n.trim().slice(0,30);const a=+prompt("التقييم (1-99):",p.r);if(a)p.r=clamp(a,1,99);save();render()}}
function renew(id){const p=pl(me(),id);if(p.lf!=null)return toast("استخدم تجديد الإعارة من صفحة الانتقالات");const y=clamp(+prompt("مدة التجديد بالسنوات (1-5):",3)||0,1,5);if(!y)return;const fee=+(val(p)*.03*y).toFixed(1);if(fee>S.budget)return toast("الميزانية لا تكفي");if(!confirm(`تجديد عقد ${p.n} ${y} سنوات: مكافأة ${fee} م، وراتبه يرتفع ${y*5}%؟`))return;p.c=y;p.w=+(p.w*(1+y*.05)).toFixed(2);S.budget=+(S.budget-fee).toFixed(1);S.led.unshift({w:S.week+1,t:`تجديد عقد ${p.n}`,a:-fee});save();render()}
function setF(f){const m=me();m.f=f;m.cx={};autoLU(m);post("مشجع","@fan"+RI(10,99),`المدرب يغير الخطة إلى ${f}! نشوف نتيجتها 🤔`);save();render()}
function setSt(s){me().st=s;save();render()}
function autoPick(){autoLU(me());save();render()}
function slotTap(i){const m=me();if(selSlot===null)selSlot=i;else if(selSlot===i)selSlot=null;else{[m.lu[selSlot],m.lu[i]]=[m.lu[i],m.lu[selSlot]];selSlot=null;save()}render()}
function place(id){if(selSlot===null)return toast("اختر مركزاً في الملعب أولاً");const m=me(),p=pl(m,id);if(!avail(p))return toast("اللاعب غير متاح");const j=m.lu.indexOf(id);if(j>=0)[m.lu[selSlot],m.lu[j]]=[m.lu[j],m.lu[selSlot]];else m.lu[selSlot]=id;selSlot=null;save();render()}
function impRoster(){const v=$("#ros").value;try{const j=JSON.parse(v);if(!j.clubs)throw 0;localStorage.setItem(RKEY,v);toast("تم الحفظ. ابدأ مسيرة جديدة لتطبيقها")}catch(e){toast("صيغة JSON غير صحيحة")}}
window.addEventListener("pagehide",()=>{if(S)save()});render();
</script>
